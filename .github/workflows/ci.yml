name: CI

# Every PR, and pushes to master. Not pushes to dev: publish.yml runs on those
# and calls this whole workflow before it pushes an image, so a dev push that
# also triggered this directly started two runs of the same suite against the
# same commit — and both landed in the concurrency group below, where the
# second cancelled the first.
#
# That was not merely wasteful. The run it cancelled was often the one *inside*
# publish.yml, which took the publish down with it: the images for the merge of
# #33 were never pushed, because the CI run for the merge of #34 eighteen
# seconds later shared this group and stopped it. publish.yml sets
# `cancel-in-progress: false` precisely to prevent that, and this reached past
# it. Dev still gets the full suite on every push — through publish.yml, which
# will not publish anything the suite has not passed.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by publish.yml, which will not run without this even though the
  # `uses:` reference looks like it should be enough on its own.
  workflow_call:

concurrency:
  # A second push to the same branch makes the first run irrelevant. Runs called
  # by publish.yml share this group with each other, which is harmless: that
  # workflow serialises itself, so two of its runs are never in flight at once.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          # The suite sets these itself in conftest, but only via setdefault,
          # so naming them here documents what the code requires to import at
          # all rather than leaving it to a fixture.
          DATABASE_URL: "sqlite://"
          JWT_SECRET: "ci-secret-that-is-at-least-thirty-two-bytes-long"
        run: python -m pytest tests/ -q

  migrations:
    name: Migrations on Postgres
    runs-on: ubuntu-latest
    # The suite builds its schema with create_all and never runs a migration,
    # so a broken one passes every test. This job is the only thing that would
    # catch it, and it uses Postgres because that is what production runs.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restyle_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upgrade, downgrade, upgrade again
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restyle_ci
          JWT_SECRET: "ci-secret-that-is-at-least-thirty-two-bytes-long"
        # Round-tripping proves the downgrades are real rather than stubs, which
        # is what makes a bad migration recoverable instead of permanent.
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        # npm ci, so the lockfile is authoritative and a drifting transitive
        # dependency fails here rather than in an image nobody rebuilt.
        run: npm ci

      - name: Typecheck
        working-directory: web
        # typegen first: the route types every loader imports are generated,
        # and tsc cannot resolve them until they exist.
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
